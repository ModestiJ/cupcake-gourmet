<ol class="timeline">
  {% for etapa in linha_do_tempo %}
    <li class="{% if etapa.cancelado %}cancelado feito{% elif etapa.feito %}feito{% else %}pendente{% endif %}">
      <span class="ponto" aria-hidden="true"></span>
      <strong>{{ etapa.rotulo }}</strong>
      {% if etapa.quando %}<br><span class="muted">{{ etapa.quando|date:"d/m H:i" }}</span>{% endif %}
    </li>
  {% endfor %}
</ol>
