{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="form-estreito">
  <h1>Entrar</h1>
  <form method="post" class="cartao" novalidate>{% csrf_token %}
    {% include "_campos.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primario btn-bloco" type="submit">Entrar</button>
  </form>
  <p class="muted" style="text-align:center">Ainda não tem conta? <a href="{% url 'contas:cadastro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Cadastre-se</a></p>
</div>
{% endblock %}
