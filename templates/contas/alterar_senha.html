{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="form-estreito">
  <p><a href="{% url 'contas:perfil' %}">← Minha conta</a></p>
  <h1>Alterar senha</h1>
  <form method="post" class="cartao" novalidate>{% csrf_token %}
    {% include "_campos.html" %}
    <p class="muted" style="font-size:.82rem">A nova senha precisa ter pelo menos 8 caracteres e não pode ser só números.</p>
    <div class="linha">
      <button class="btn btn-primario" type="submit">Salvar nova senha</button>
      <a class="btn btn-secundario" href="{% url 'contas:perfil' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
